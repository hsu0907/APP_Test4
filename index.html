<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheriff Robot - 3D Coordinates</title>
<style>
body{margin:0;background:#101820;color:#00ff88;font-family:Consolas,monospace;text-align:center}
h1{margin:20px 0 5px}p{color:#bbb}
.container{position:relative;width:90%;max-width:900px;margin:20px auto}
video{width:100%;display:block;transform:scaleX(-1);border:2px solid #00ff88;border-radius:8px;box-sizing:border-box}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.panel{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:20px}
.data{background:#1d2b36;border:1px solid #00ff88;padding:15px 22px;border-radius:8px;min-width:130px}
.value{font-size:24px;margin-top:8px}
button{padding:12px 25px;margin:8px;cursor:pointer;border:0;border-radius:6px;font-size:16px}
#start{background:#00ff88}#stop{background:#ff5252;color:white}#status{color:#fff;overflow-wrap:anywhere;padding:0 16px}
</style>
</head>
<body>
<h1>SHERIFF ROBOT</h1>
<p>3D FACE COORDINATE TRACKING SYSTEM</p>
<div class="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>
<div class="panel">
  <div class="data">X AXIS · 좌우<div class="value" id="x">0 px</div></div>
  <div class="data">Y AXIS · 위아래<div class="value" id="y">0 px</div></div>
  <div class="data">Z AXIS · 앞뒤 추정<div class="value" id="z">-- cm</div></div>
</div>
<button id="start">카메라 시작</button>
<button id="stop">카메라 종료</button>
<p id="status">카메라 시작 버튼을 눌러 주세요.</p>
<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const startButton = document.getElementById("start");
let landmarker = null, stream = null, running = false, starting = false, lastVideoTime = -1;

const REFERENCE_WIDTH = 160;
const REFERENCE_DISTANCE = 100;

async function startCamera() {
  if (running || starting) return;
  starting = true;
  startButton.disabled = true;
  status.textContent = "얼굴 인식 모델을 불러오는 중...";
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("카메라 기능을 사용할 수 없습니다. Live Server(localhost) 또는 HTTPS로 페이지를 여세요.");
    }

    if (!landmarker) {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      // GPU를 지원하지 않는 환경에서도 실행되도록 CPU 사용
      landmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "CPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    status.textContent = "카메라 권한을 기다리는 중...";
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }, audio: false
    });
    video.srcObject = stream;
    await new Promise((resolve, reject) => {
      if (video.readyState >= 1 && video.videoWidth > 0) resolve();
      else {
        video.onloadedmetadata = () => resolve();
        video.onerror = () => reject(new Error("카메라 영상을 불러오지 못했습니다."));
      }
    });
    await video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    running = true;
    lastVideoTime = -1;
    status.textContent = "시스템 작동 중";
    requestAnimationFrame(detectFace);
  } catch (error) {
    stopCamera(false);
    status.textContent = "실행 오류: " + (error.message || error.name) +
      " | 주소를 localhost/HTTPS로 열고 카메라 권한과 인터넷 연결을 확인하세요.";
  } finally {
    starting = false;
    startButton.disabled = false;
  }
}

function detectFace() {
  if (!running) return;
  try {
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const result = landmarker.detectForVideo(video, performance.now());
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (result.faceLandmarks.length > 0) {
        const points = result.faceLandmarks[0];
        const left = points[234], right = points[454];
        const top = points[10], bottom = points[152];
        const cx = (left.x + right.x) / 2;
        const cy = (top.y + bottom.y) / 2;
        const faceWidth = Math.abs(right.x - left.x) * canvas.width;

        const X = Math.round((0.5 - cx) * canvas.width);
        const Y = Math.round((0.5 - cy) * canvas.height);
        const Z = faceWidth > 0 ? REFERENCE_DISTANCE * REFERENCE_WIDTH / faceWidth : 0;

        document.getElementById("x").textContent = (X >= 0 ? "+" : "") + X + " px";
        document.getElementById("y").textContent = (Y >= 0 ? "+" : "") + Y + " px";
        document.getElementById("z").textContent = Z.toFixed(1) + " cm";

        const px = (1 - cx) * canvas.width, py = cy * canvas.height;
        const boxX = (1 - right.x) * canvas.width;
        const boxY = top.y * canvas.height;
        const boxW = Math.abs(right.x - left.x) * canvas.width;
        const boxH = Math.abs(bottom.y - top.y) * canvas.height;

        ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3;
        ctx.strokeRect(boxX, boxY, boxW, boxH);
        ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2);
        ctx.fillStyle = "#ff4444"; ctx.fill();
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, canvas.height / 2);
        ctx.lineTo(px, py); ctx.strokeStyle = "#00ffff"; ctx.stroke();
        status.textContent = "TARGET LOCKED";
      } else {
        document.getElementById("x").textContent = "0 px";
        document.getElementById("y").textContent = "0 px";
        document.getElementById("z").textContent = "-- cm";
        status.textContent = "얼굴을 찾는 중...";
      }
    }
    requestAnimationFrame(detectFace);
  } catch (error) {
    stopCamera(false);
    status.textContent = "얼굴 인식 오류: " + (error.message || error.name);
  }
}

function stopCamera(showMessage = true) {
  running = false;
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
  if (canvas.width && canvas.height) ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById("x").textContent = "0 px";
  document.getElementById("y").textContent = "0 px";
  document.getElementById("z").textContent = "-- cm";
  if (showMessage) status.textContent = "카메라가 종료되었습니다.";
}

document.getElementById("start").addEventListener("click", startCamera);
document.getElementById("stop").addEventListener("click", () => stopCamera(true));
window.addEventListener("beforeunload", () => stopCamera(false));
</script>
</body>
</html>
